# Deterministic checks for this project (the checks module schema: `[[check]]`).
#
# This is working tooling, not task state, review evidence, or a record of when a
# command ran. It is also a narrow, hand-curated file rather than full checks-module
# self-adoption; add more `[[check]]` rows as the project adopts the module.
#
# The row below pins an invariant this repository already depends on. `pack/` is
# embedded into the binary at compile time (`include_dir!` in `src/manifest.rs`), and
# `build.rs` records the pack as maintainer-controlled and all-ASCII. A stray
# non-ASCII byte in a pack asset would therefore be compiled in and dropped into
# every scaffolded project's guidance, so the check reads the tracked pack bytes and
# fails when it finds one. Nothing else in the repository is held to this rule: a
# non-ASCII test fixture elsewhere in `src/` is deliberate, which is why `paths` and
# the grep both scope to `pack/`.
#
# It is a lint in the strict sense: `git grep` only reads, so a run mutates neither
# the temporary worktree it executes in nor the live tree. The leading `!` inverts
# git grep's exit status, which is 0 when it FINDS a match; the command needs no tool
# beyond the `git` the development shell already pins.

[[check]]
name = "pack-ascii"
kind = "lint"
command = '! LC_ALL=C git grep -nP "[^\x00-\x7F]" -- pack'
paths = ["pack/"]
