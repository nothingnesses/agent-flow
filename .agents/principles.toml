# Compact built-in principle set. Projects may select and order any subset.

[[principle]]
id = "ask-clarifying-questions"
name = "Ask clarifying questions before forging ahead"
summary = "Confirm intent before writing code, and give recommendations with reasoning."
rationale = "Clarifying material ambiguity before editing is cheaper than implementing the wrong change."
tags = ["agent-process", "universal"]
default_selected = true
default_order = 10

[[principle]]
id = "ground-decisions-in-evidence"
name = "Ground decisions in evidence"
summary = "Inspect the code and run a small proof before committing to an approach."
rationale = "Evidence from the actual project beats assumptions and makes a decision reproducible."
tags = ["agent-process", "universal"]
default_selected = true
default_order = 20

[[principle]]
id = "keep-changes-small-and-reviewable"
name = "Keep changes small and reviewable"
summary = "Prefer one bounded product change that fits in a reviewer's head."
rationale = "Small changes are easier to understand, verify, and reverse."
tags = ["agent-process", "architecture", "universal"]
default_selected = true
default_order = 30

[[principle]]
id = "independent-or-adversarial-review"
name = "Have independent product review"
summary = "Have someone other than the author check the product before acceptance."
rationale = "An author's own review claim is not independent evidence and shares the author's blind spots."
tags = ["agent-process", "correctness", "universal"]
default_selected = true
default_order = 40

[[principle]]
id = "verify-dont-trust"
name = "Verify, don't trust"
summary = "Run the code and tests rather than asserting success from having written them."
rationale = "Execution checks behaviour against reality and exposes false confidence."
tags = ["agent-process", "correctness", "universal"]
default_selected = true
default_order = 50

[[principle]]
id = "no-silent-scope-expansion"
name = "No silent scope expansion"
summary = "Do what was accepted and return anything else to the human."
rationale = "Unrequested changes evade the agreed acceptance boundary and are harder to review safely."
tags = ["agent-process", "universal"]
default_selected = true
default_order = 60

[[principle]]
id = "tests-must-exercise-code"
name = "Tests must exercise the code they claim to"
summary = "A test must run the changed path and assert its observable result."
rationale = "A passing test that misses its target provides false confidence."
tags = ["correctness", "universal"]
default_selected = true
default_order = 70

[[principle]]
id = "fail-fast-and-loudly"
name = "Fail fast and loudly"
summary = "Report errors and unresolved work instead of hiding or looping around them."
rationale = "A visible failure gives the human a truthful decision point."
tags = ["correctness", "universal"]
default_selected = true
default_order = 80

[[principle]]
id = "one-source-of-truth"
name = "One source of truth"
summary = "Keep one authoritative source for each piece of state and derive projections."
rationale = "Duplicated state drifts and creates contradictory instructions."
tags = ["data-modelling", "architecture", "universal"]
default_selected = true
default_order = 90

[[principle]]
id = "validate-and-parse-untrusted-input"
name = "Parse untrusted input at the boundary"
summary = "Reject malformed external input before it reaches the core."
rationale = "Boundary parsing turns hostile or malformed input into trusted, precise data or a loud error."
tags = ["security", "data-modelling", "universal"]
default_selected = true
default_order = 100

[[principle]]
id = "keep-secrets-out-of-code-and-logs"
name = "Keep secrets out of code and logs"
summary = "Load credentials from the environment or a secret store."
rationale = "Secrets committed to source or printed in logs are difficult to contain."
tags = ["security", "universal"]
default_selected = true
default_order = 110

[[principle]]
id = "kiss"
name = "Keep it simple"
summary = "Prefer the simplest design that satisfies the current acceptance criteria."
rationale = "Complexity should earn its place through a present requirement."
tags = ["architecture", "universal"]
default_selected = false
default_order = 120

[[principle]]
id = "prefer-immutability"
name = "Prefer immutability"
summary = "Keep state changes local and explicit."
rationale = "Immutable data is easier to reason about and review."
tags = ["data-modelling", "fp"]
default_selected = false
default_order = 130
