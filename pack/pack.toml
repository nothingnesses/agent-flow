# Built-in minimal pack. Core output is one bounded work file plus compact guidance.
# Product-development checks and their hook are an explicit opt-in module.

[[module]]
name = "checks"
description = "Optional lint, format, and hook assets for product development; these are checks, not task state."
guidance = "checks-guidance.md"

[[asset]]
source = "AGENTS.md"
dest = "AGENTS.md"
ownership = "working"
render = true

[[asset]]
source = "work.toml"
dest = ".agents/work.toml"
ownership = "working"

[[asset]]
source = "AGENTS.md"
dest = ".agents/AGENTS.reference.md"
ownership = "reference"
render = true

[[asset]]
source = "prompts/implementer.md"
dest = ".agents/prompts/implementer.md"
ownership = "reference"

[[asset]]
source = "prompts/reviewer.md"
dest = ".agents/prompts/reviewer.md"
ownership = "reference"

[[asset]]
source = "prompts/triager.md"
dest = ".agents/prompts/triager.md"
ownership = "reference"

[[asset]]
source = "prompts/fixer.md"
dest = ".agents/prompts/fixer.md"
ownership = "reference"

[[asset]]
source = "prompts/verifier.md"
dest = ".agents/prompts/verifier.md"
ownership = "reference"

[[asset]]
source = "principles.toml"
dest = ".agents/principles.toml"
ownership = "reference"

[[asset]]
source = "user-prompts/kickoff.md"
dest = ".agents/user-prompts/kickoff.md"
ownership = "reference"

[[asset]]
source = "user-prompts/review.md"
dest = ".agents/user-prompts/review.md"
ownership = "reference"

[[asset]]
source = "user-prompts/adopt.md"
dest = ".agents/user-prompts/adopt.md"
ownership = "reference"

# Optional product-development checks. No asset in this module is task state.
[[asset]]
source = "checks.toml"
dest = ".agents/checks.toml"
ownership = "working"
module = "checks"

[[asset]]
source = "checks/ast-grep/sgconfig.yml"
dest = ".agents/checks/ast-grep/sgconfig.yml"
ownership = "working"
module = "checks"

[[asset]]
source = "checks/ast-grep/rules/no-dbg-macro.yml"
dest = ".agents/checks/ast-grep/rules/no-dbg-macro.yml"
ownership = "working"
module = "checks"

[[asset]]
source = "prompts/checks-reviewer.md"
dest = ".agents/prompts/checks-reviewer.md"
ownership = "reference"
module = "checks"

[[asset]]
source = "hooks/pre-commit"
dest = ".agents/hooks/pre-commit"
ownership = "reference"
module = "checks"
executable = true
