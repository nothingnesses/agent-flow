# Optional deterministic product-development checks (`--module checks`).
#
# This working file is created once and is yours to edit. It is tooling, not task
# state, review evidence, or a record of when a command ran.
#
# Each `[[check]]` is a flat table:
#   name      required unique id shown in output
#   kind      required: lint | format | test | mutation
#   command   required primary command; for format this is the apply command
#   check     optional secondary command; for format this is the check command
#   paths     optional globs that scope a check to matching files
#   budget    optional mutation wall-clock cap, such as "10m"
#   threshold optional maximum surviving mutants
#
# `agent-flow checks` runs lint commands and format check commands in temporary
# isolation. Prefer a non-mutating format check such as `rustfmt --check`. Some
# tools, including treefmt v2 via `nix fmt --fail-on-change`, modify the isolated
# copy before reporting failure; those changes are discarded. The current checks
# command skips test and mutation entries.
#
# An implementer may run a format entry's apply command over files it changed.
# The optional checks reviewer reports command output directly and edits nothing.
# Neither result replaces independent product review.

[[check]]
name = "ast-grep"
kind = "lint"
command = "ast-grep scan --config .agents/checks/ast-grep/sgconfig.yml"

[[check]]
name = "format"
kind = "format"
command = "nix fmt"
check = "nix fmt -- --fail-on-change"

