name: ci

on:
  pull_request:
    # The first three are the default set, which naming any type replaces. `edited`
    # is the addition: it fires on a title or body change, and those are what
    # `.agents/checks/attribution-metadata.sh` reads, so an edit is checked again
    # rather than riding on the run that the opening commit passed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Read-only: the gate inspects the tree and runs no release, publish, or write step.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `quality` is the stable check name remote branch protection requires. Renaming
  # the job silently disables that protection, so keep the id and the name together.
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs, not tags: a tag can be moved onto other code.
      - name: Check out the commit under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The attribution check reads every commit reachable from its target, so
          # the default single-commit checkout would hide all but the tip. The ref
          # stays the default, so a pull request still builds and tests the merge
          # result rather than the branch tip alone.
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # The committed flake supplies the locked toolchain; `.agents/checks/ci-gate.sh`
      # is the same gate `just ci` runs locally. Already inside `nix develop`, so the
      # recipe must not wrap the script in direnv a second time.
      - name: Run the shared gate
        env:
          SKIP_DIRENV: "1"
          # On a pull request the checked out tip is a merge commit GitHub itself
          # authors, which no author allowlist can accept. Point the attribution
          # check at the head commit of the branch, and at the pushed commit on a
          # push. The merge commit has that head as a parent, so the fetched
          # history already contains it.
          ATTRIBUTION_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          # The metadata check reads the pull request's title and body out of the
          # event file itself. Only the event's name and location are passed in, both
          # of them GitHub's own values; interpolating the title or the body here
          # would run a stranger's text as part of this script.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: nix develop --command just ci
